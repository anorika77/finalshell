name: Terminal Engine Spike

on:
  push:
    paths:
      - "spikes/terminal-engine-smoke/**"
      - ".github/workflows/terminal-spike.yml"
  pull_request:
    paths:
      - "spikes/terminal-engine-smoke/**"
      - ".github/workflows/terminal-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-spike-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-core:
    name: Terminal core (\${{ matrix.name }})
    runs-on: \${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            needs-zig: false
          - name: macOS x86_64
            runner: macos-15-intel
            needs-zig: false
          - name: Linux x86_64
            runner: ubuntu-24.04
            needs-zig: true
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            needs-zig: true
          - name: Windows x86_64 MSVC
            runner: windows-2025
            needs-zig: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
          matcher: true

      - name: Set up Zig for source builds
        if: matrix.needs-zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
          cache-key: terminal-spike-\${{ matrix.name }}

      - name: Print toolchain versions
        run: |
          rustc --version
          cargo --version
          zig version || true

      - name: Check formatting
        run: cargo fmt --manifest-path spikes/terminal-engine-smoke/Cargo.toml --all -- --check

      - name: Run terminal engine tests
        run: cargo test --manifest-path spikes/terminal-engine-smoke/Cargo.toml --all-targets -- --nocapture

      - name: Build terminal engine smoke binary
        run: cargo build --manifest-path spikes/terminal-engine-smoke/Cargo.toml --release
