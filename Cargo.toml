[package]
name = "finallyshell-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A cross-platform Rust rewrite of FinalShell"
repository = "https://github.com/anorika77/finalshell"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
russh = { version = "=0.65.4", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "=4.0.0"
vt100 = "=0.16.2"
encoding_rs = "=0.8.35"
csv = "=1.4.0"
calamine = "=0.31.0"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "io-util", "macros", "fs"] }
