name: UI Framework Spike - GPUI CE

on:
  push:
    paths:
      - "spikes/ui-gpui-smoke/**"
      - ".github/workflows/ui-gpui-spike.yml"
  pull_request:
    paths:
      - "spikes/ui-gpui-smoke/**"
      - ".github/workflows/ui-gpui-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-gpui-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpui:
    name: GPUI CE (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
          - name: macOS x86_64
            runner: macos-15-intel
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: Windows x86_64
            runner: windows-2025

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
          matcher: true

      - name: Check formatting
        run: cargo fmt --manifest-path spikes/ui-gpui-smoke/Cargo.toml --all -- --check

      - name: Test GPUI prototype contracts
        run: cargo test --manifest-path spikes/ui-gpui-smoke/Cargo.toml --all-targets

      - name: Build GPUI desktop prototype
        run: cargo build --manifest-path spikes/ui-gpui-smoke/Cargo.toml --release
