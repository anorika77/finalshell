name: UI Framework Spike - Iced

on:
  push:
    paths:
      - "spikes/ui-iced-smoke/**"
      - ".github/workflows/ui-iced-spike.yml"
  pull_request:
    paths:
      - "spikes/ui-iced-smoke/**"
      - ".github/workflows/ui-iced-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-iced-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iced:
    name: Iced (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
          - name: macOS x86_64
            runner: macos-15-intel
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: Windows x86_64
            runner: windows-2025

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
          matcher: true

      - name: Check formatting
        run: cargo fmt --manifest-path spikes/ui-iced-smoke/Cargo.toml --all -- --check

      - name: Test pane and session identity contract
        run: cargo test --manifest-path spikes/ui-iced-smoke/Cargo.toml --all-targets

      - name: Build Iced desktop prototype
        run: cargo build --manifest-path spikes/ui-iced-smoke/Cargo.toml --release
